<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VI PortWatch</title>
<style>body{margin:0;background:#070812;color:#fff;font-family:Arial;padding:18px}main{max-width:1200px;margin:auto}.hero,.panel{background:#111426;border:1px solid #303451;border-radius:18px;padding:20px;margin-bottom:15px}.hero{background:linear-gradient(135deg,#211744,#12152b)}h1{font-size:46px}h1 span{color:#ff3fa8}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#090c18;border:1px solid #303451;border-radius:12px;padding:12px}.stat b{font-size:22px}.layout{display:grid;grid-template-columns:1.4fr .8fr;gap:15px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{background:#171a31;border:1px solid #343858;border-radius:14px;padding:14px}.rank{color:#ffd52a;font-weight:bold}.name{font-size:20px;font-weight:bold;margin:5px 0}.item{padding:10px;border-bottom:1px solid #292d48;font-size:12px}.pill{background:#25e7c6;color:#061510;padding:3px 6px;border-radius:5px;font-size:8px;font-weight:bold}@media(max-width:800px){.layout{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:1fr}} </style></head>
<body><main><div class="hero"><div>GTA 6 PC PORT RACE • LIVE TRACKER</div><h1>WHO GETS <span>GTA 6</span> ON PC FIRST?</h1><p>Live community progress and latest activity.</p><div class="stats"><div class="stat"><b id="total">—</b><br>Efforts tracked</div><div class="stat"><b id="leader">—</b><br>Current leader</div><div class="stat"><b id="progress">—</b><br>Overall progress</div><div class="stat"><b id="checked">—</b><br>Last checked</div></div></div>
<div class="layout"><section class="panel"><h2>🏆 Top Builds</h2><div class="cards" id="cards">Loading…</div></section><aside class="panel"><h2>⚡ Latest Activity</h2><div id="activity">Loading…</div></aside></div></main>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const pick=(o,keys,d="—")=>{for(const k of keys)if(o&&o[k]!=null&&o[k]!=="")return o[k];return d};
function render(d){const a=Array.isArray(d)?d:(d.projects||d.builds||d.leaderboard||d.efforts||d.items||[]);const act=d.news||d.activity||d.latestActivity||d.events||[];document.querySelector("#total").textContent=pick(d,["effortsTracked","tracked","total"],a.length);document.querySelector("#leader").textContent=a[0]?pick(a[0],["name","title","project","author"]):"—";document.querySelector("#progress").textContent=pick(d,["overallProgress","progress"],a[0]?pick(a[0],["progress","score"]):"—");document.querySelector("#checked").textContent=pick(d,["updated","lastChecked","updatedAt"],new Date().toLocaleTimeString());document.querySelector("#cards").innerHTML=a.slice(0,4).map((b,i)=>`<article class="card"><div class="rank">${i+1} PLACE</div><div class="name">${esc(pick(b,["name","title","project","author"],"Unknown build"))}</div><p>${esc(pick(b,["description","summary","status","repo"],"Community build"))}</p><b>${esc(pick(b,["fps","score","progress"],"—"))}</b></article>`).join("")||"<div class='card'>No leaderboard data.</div>";document.querySelector("#activity").innerHTML=act.slice(0,12).map(v=>`<div class="item"><span class="pill">${esc(pick(v,["type","label"],"UPDATED"))}</span> <b>${esc(pick(v,["title","name","headline","message"],"Tracker update"))}</b><br><small>${esc(pick(v,["time","date","timestamp","updated"],"recent"))}</small></div>`).join("")||"<div>No activity data.</div>"}
async function load(){try{const r=await fetch("/api/tracker",{cache:"no-store"});if(!r.ok)throw 0;render(await r.json())}catch(e){document.querySelector("#cards").innerHTML="<div class='card'>Live data unavailable right now.</div>";document.querySelector("#activity").innerHTML="<div>No live activity available right now.</div>"}}
load();setInterval(load,180000);
</script></body></html>
